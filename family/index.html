<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>陈氏家族</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="hud">
      <div class="hud-chip hud-chip--cash">
        <span class="hud-ico">💵</span>
        <div>
          <strong id="cashLabel">33.19万</strong>
          <small id="monthDelta">+0/月</small>
        </div>
      </div>
      <div class="hud-chip hud-chip--token">
        <span class="hud-ico">🎟️</span>
        <strong id="tokenLabel">4</strong>
      </div>
      <div class="hud-date">
        <button id="pauseBtn" class="pause" type="button"><span id="pauseIcon">⏸</span></button>
        <div>
          <b id="yearLabel">2026年</b>
          <span id="monthLabel">3月</span>
        </div>
      </div>
    </header>

    <div class="clan-bar">陈氏家族</div>
    <p id="taskBar" class="task">学校越好，以后工资越高。省级入学花灵感，不看广告。</p>

    <section id="viewFamily" class="view">
      <div id="familyTree" class="tree"></div>
    </section>
    <section id="viewShop" class="view" hidden>
      <div class="seg">灵感兑换</div>
      <div id="shopList" class="shop-list"></div>
    </section>
    <section id="viewIndustry" class="view" hidden>
      <div class="seg">产业地块</div>
      <div id="industryGrid" class="indy-grid"></div>
    </section>

    <div id="personSheet" class="sheet" hidden>
      <button id="closeSheet" class="sheet-x" type="button">✕</button>
      <img id="sheetPortrait" class="sheet-avatar" alt="" />
      <h2 id="sheetName">—</h2>
      <p id="sheetMeta" class="sheet-meta">—</p>
      <dl id="sheetFacts" class="facts"></dl>
      <div id="sheetStats" class="stat-grid"></div>
      <p id="sheetHint" class="sheet-hint"></p>
    </div>

    <nav class="tabs">
      <button class="tab is-on" data-view="family" type="button">👨‍👩‍👧‍👦<br />家族</button>
      <button class="tab" data-view="shop" type="button">💡<br />灵感</button>
      <button class="tab" data-view="industry" type="button">🏙️<br />产业</button>
    </nav>
  </div>

  <dialog id="choiceModal" class="modal">
    <div class="card-pop">
      <h3 id="choiceStage" class="card-pop__stage">初中</h3>
      <div class="card-pop__hero">
        <img id="choicePortrait" alt="" />
        <span id="choiceAge" class="age-pill">12</span>
        <span id="choiceFlow" class="flow-pill">-273/月</span>
      </div>
      <div id="choiceWho" class="card-pop__name">—</div>
      <p id="choiceTip" class="card-pop__tip">—</p>
      <div id="choiceList" class="choice-btns"></div>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
