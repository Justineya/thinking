<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>家族谱 · 人生模拟</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="rotateHint" class="rotate-hint">
    <p>请把手机横过来玩</p>
  </div>

  <div id="app" class="app">
    <header class="top-bar">
      <div class="top-bar__left">
        <span class="top-bar__title">家族谱</span>
        <span id="dateLabel" class="top-bar__date">2026年3月</span>
        <span class="top-bar__hint">到点自动弹窗 · 抽卡决定学校/对象</span>
      </div>
      <div class="top-bar__right">
        <span class="assets-inline">资产 <strong id="assetsLabel">¥860,000</strong></span>
        <div class="money-pill">
          <span class="money-pill__label">现金</span>
          <span id="cashLabel" class="money-pill__value">¥128,600</span>
        </div>
        <button id="pauseBtn" class="icon-btn" type="button" aria-label="暂停/继续">
          <span id="pauseIcon">⏸</span>
        </button>
      </div>
    </header>

    <div class="stage">
      <main class="tree-scroll">
        <div id="familyTree" class="family-tree" aria-label="家族谱"></div>
      </main>

      <aside id="detailPanel" class="detail-panel" hidden>
        <div class="detail-panel__header">
          <h2 id="detailName">—</h2>
          <button id="closeDetail" class="icon-btn icon-btn--ghost" type="button" aria-label="关闭">✕</button>
        </div>
        <div class="detail-panel__portrait-wrap">
          <img id="detailPortrait" class="detail-panel__portrait" src="" alt="" />
          <div class="detail-panel__meta">
            <span id="detailAge">—</span>
            <span id="detailRole">—</span>
          </div>
        </div>
        <div id="detailStats" class="stat-grid"></div>
      </aside>
    </div>
  </div>

  <dialog id="gachaModal" class="modal modal--gacha">
    <div class="modal__sheet modal__sheet--gacha">
      <div id="gachaBadge" class="event-badge">人生节点</div>
      <h3 id="gachaTitle">—</h3>
      <p id="gachaBody" class="event-body">—</p>
      <div id="gachaCard" class="gacha-card" hidden>
        <span id="gachaRarity" class="gacha-card__rarity">N</span>
        <div id="gachaCardName" class="gacha-card__name">—</div>
        <p id="gachaCardDesc" class="gacha-card__desc">—</p>
        <div id="gachaCardMeta" class="gacha-card__meta">—</div>
      </div>
      <div class="event-choices">
        <button id="gachaDrawBtn" class="event-choice" type="button">抽一次</button>
        <button id="gachaAcceptBtn" class="event-choice" type="button" hidden>收下</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
