services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cpt
      POSTGRES_USER: cpt
      POSTGRES_PASSWORD: cpt
    ports:
      - "5432:5432"
    volumes:
      - cpt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpt -d cpt"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8787"
    environment:
      DATABASE_URL: postgresql+asyncpg://cpt:cpt@db:5432/cpt
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://127.0.0.1:8787,http://localhost:8787
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy

volumes:
  cpt_pgdata:
