services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cpt
      POSTGRES_PASSWORD: cpt
      POSTGRES_DB: cpt
    ports:
      - "5432:5432"
    volumes:
      - cpt_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpt -d cpt"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: postgresql+psycopg2://cpt:cpt@db:5432/cpt
      PYTHONPATH: .
    command: bash -lc "pip install -r requirements.txt -q && uvicorn backend.app.main:app --host 0.0.0.0 --port 8787"
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy

volumes:
  cpt_pg:
