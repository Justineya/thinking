<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CPT 登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0f0e;
      --panel: #121916;
      --line: rgba(210, 220, 210, 0.14);
      --text: #e7eee8;
      --mute: #8fa094;
      --accent: #7dd3a7;
      --warn: #f97316;
      --serif: "Noto Serif SC", "Songti SC", serif;
      --sans: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(34, 197, 94, 0.14), transparent 55%),
        radial-gradient(700px 380px at 90% 0%, rgba(249, 115, 22, 0.1), transparent 50%),
        var(--bg);
    }
    .card {
      width: min(420px, 100%);
      background: rgba(18, 25, 22, 0.92);
      border: 1px solid var(--line);
      padding: 1.6rem 1.4rem 1.4rem;
    }
    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 2rem;
      letter-spacing: 0.08em;
    }
    .sub { margin: 0.35rem 0 1.2rem; color: var(--mute); font-size: 0.92rem; }
    label {
      display: grid;
      gap: 0.35rem;
      margin-bottom: 0.85rem;
      color: var(--mute);
      font-size: 0.8rem;
    }
    input, button {
      font: inherit;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      padding: 0.7rem 0.85rem;
      border-radius: 0;
      width: 100%;
    }
    button {
      margin-top: 0.4rem;
      background: #1a3d2a;
      border-color: #2f6b4a;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    .err {
      color: #ffb4b4;
      min-height: 1.2rem;
      font-size: 0.85rem;
      margin: 0.4rem 0 0;
    }
    .hint { margin-top: 1rem; color: var(--mute); font-size: 0.78rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CPT</h1>
    <p class="sub">周期位置交易 · 登录后进入仪表盘</p>
    <form id="loginForm">
      <label>账号
        <input id="username" name="username" autocomplete="username" required autofocus />
      </label>
      <label>密码
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit">登录</button>
      <p class="err" id="err"></p>
    </form>
  </div>
  <script>
    (function () {
      const form = document.getElementById('loginForm');
      const err = document.getElementById('err');
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        err.textContent = '';
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password }),
          });
          const data = await res.json().catch(function () { return {}; });
          if (!res.ok) {
            err.textContent = data.detail || ('登录失败 ' + res.status);
            return;
          }
          window.location.href = '/';
        } catch (ex) {
          err.textContent = String(ex.message || ex);
        }
      });
    })();
  </script>
</body>
</html>
