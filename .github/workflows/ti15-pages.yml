name: Deploy TI15 site

on:
  push:
    branches: [main]
    paths:
      - "ti15-analyzer/web/**"
      - ".github/workflows/ti15-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ti15-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ti15-analyzer/web
      - id: deployment
        uses: actions/deploy-pages@v4
